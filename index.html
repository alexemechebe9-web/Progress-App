<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress | Account Setup</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <section class="welcome-panel" aria-label="Progress opening screen">
      <div class="brand-mark" aria-hidden="true">P</div>
      <button class="primary-button" id="get-started" type="button">Get Started</button>

      <form class="account-form" id="account-form" novalidate hidden>
        <div class="form-heading">
          <h2>Set up your account</h2>
          <p>Choose your sign-in details to continue.</p>
        </div>

        <div class="field-group">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="new-password" required>
            <button class="password-toggle" id="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
              <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                <circle cx="12" cy="12" r="2.5"></circle>
              </svg>
              <svg class="eye-off-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden>
                <path d="m3 3 18 18"></path>
                <path d="M10.6 6.2A10.4 10.4 0 0 1 12 6c6 0 9.5 6 9.5 6a17.3 17.3 0 0 1-3.1 3.5M6.3 6.3C3.8 8.1 2.5 12 2.5 12s3.5 6 9.5 6a9.7 9.7 0 0 0 3-.5"></path>
              </svg>
            </button>
          </div>
        </div>

        <p class="error-message" id="form-error" role="alert" hidden>Fill in all the boxes.</p>
        <button class="primary-button" type="submit">Continue</button>
      </form>
    </section>
  </main>
</body>
</html>
